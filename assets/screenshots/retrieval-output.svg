<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">miniR retrieval output screenshot</title>
  <desc id="desc">Illustrative screenshot of evidence-ready retrieval results returned by miniR.</desc>
  <rect width="1280" height="760" fill="#eef2f7"/>
  <rect x="56" y="52" width="1168" height="656" rx="8" fill="#ffffff" stroke="#d7dde8"/>
  <text x="92" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">/retrieve</text>
  <text x="204" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">evidence-ready context for AI agents</text>
  <rect x="92" y="136" width="1096" height="78" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="118" y="166" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">Query</text>
  <text x="118" y="192" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#111827">How should the agent configure miniR retrieval?</text>
  <rect x="92" y="246" width="700" height="374" rx="8" fill="#0f172a"/>
  <text x="124" y="286" font-family="Consolas, Menlo, monospace" font-size="14" fill="#93c5fd">POST http://localhost:8765/retrieve</text>
  <text x="124" y="326" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0">{</text>
  <text x="152" y="354" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0">"answer_context": "Use /retrieve with query and top_k...",</text>
  <text x="152" y="382" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0">"results": [</text>
  <text x="180" y="410" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0">{"source": "skill/minir-retrieval/SKILL.md",</text>
  <text x="194" y="438" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0">"score": 0.92,</text>
  <text x="194" y="466" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0">"images": ["E:/2026/miniR/doc/images/..."]}</text>
  <text x="152" y="494" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0">]</text>
  <text x="124" y="522" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0">}</text>
  <rect x="830" y="246" width="322" height="374" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="862" y="286" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Hybrid ranking</text>
  <rect x="862" y="316" width="238" height="34" rx="6" fill="#dbeafe"/>
  <text x="884" y="338" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">BM25 lexical match</text>
  <rect x="862" y="368" width="238" height="34" rx="6" fill="#dcfce7"/>
  <text x="884" y="390" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">Dense vector search</text>
  <rect x="862" y="420" width="238" height="34" rx="6" fill="#fef3c7"/>
  <text x="884" y="442" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Sparse embedding</text>
  <rect x="862" y="472" width="238" height="34" rx="6" fill="#fae8ff"/>
  <text x="884" y="494" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#86198f">Optional reranker</text>
  <line x1="862" y1="548" x2="1100" y2="548" stroke="#cbd5e1"/>
  <text x="862" y="582" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Stable JSON contract for agents</text>
</svg>
