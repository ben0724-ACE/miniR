<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="915" viewBox="0 0 1860 915" role="img" aria-labelledby="title desc">
  <title id="title">miniR 检索测试界面截图</title>
  <desc id="desc">RAG 知识库管理系统的检索测试页面，包含查询内容、返回结果数、Rerank 选项和开始检索按钮。</desc>
  <rect width="1860" height="915" rx="6" fill="#f3f6fb"/>
  <rect x="1" y="1" width="1858" height="913" rx="6" fill="none" stroke="#94a3b8"/>
  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(174 28)">
      <rect x="0" y="4" width="18" height="28" fill="#83d84f" stroke="#4cae2f"/>
      <rect x="8" y="12" width="18" height="28" fill="#60a5fa" stroke="#2563eb"/>
      <rect x="16" y="20" width="18" height="28" fill="#e64980" stroke="#be185d"/>
      <line x1="-4" y1="30" x2="37" y2="30" stroke="#475569" stroke-width="2"/>
      <text x="52" y="31" font-size="38" font-weight="700" fill="#020617">RAG 知识库管理系统</text>
    </g>

    <g transform="translate(170 92)" font-size="18">
      <text x="20" y="16" fill="#020617">文档入库</text>
      <text x="130" y="16" fill="#020617">文档列表</text>
      <text x="240" y="16" fill="#2563eb">检索测试</text>
      <text x="350" y="16" fill="#020617">系统管理</text>
      <line x1="0" y1="29" x2="1520" y2="29" stroke="#d7dce5"/>
      <line x1="220" y1="29" x2="330" y2="29" stroke="#3b82f6" stroke-width="3"/>
    </g>

    <text x="174" y="170" font-size="25" font-weight="700" fill="#020617">🔍 检索测试</text>
    <text x="170" y="216" font-size="18" fill="#020617">测试 RAG 检索效果，使用混合检索模式（BM25 + Dense + Sparse）。</text>

    <rect x="170" y="245" width="1520" height="112" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="186" y="276" font-size="17" fill="#64748b">查询内容</text>
    <rect x="186" y="292" width="1488" height="51" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="198" y="325" font-size="17" fill="#a8b1c1">如 机器学习基础概念、论文摘要检索</text>

    <rect x="170" y="377" width="1520" height="105" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="186" y="410" font-size="17" fill="#64748b">返回结果数</text>
    <line x1="207" y1="445" x2="883" y2="445" stroke="#e5e7eb" stroke-width="10" stroke-linecap="round"/>
    <line x1="207" y1="445" x2="354" y2="445" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="354" cy="445" r="11" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="186" y="453" font-size="15" fill="#94a3b8">1</text>
    <text x="895" y="453" font-size="15" fill="#94a3b8">20</text>

    <rect x="795" y="390" width="120" height="29" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="824" y="411" font-size="16" fill="#020617">5</text>
    <text x="890" y="411" font-size="17" fill="#020617">↻</text>

    <text x="944" y="410" font-size="17" fill="#64748b">使用 Rerank</text>
    <rect x="945" y="425" width="80" height="43" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <circle cx="971" cy="446" r="10" fill="#3b82f6"/>
    <circle cx="971" cy="446" r="4" fill="#ffffff"/>
    <text x="992" y="453" font-size="17" fill="#020617">是</text>
    <rect x="1036" y="425" width="78" height="43" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <circle cx="1061" cy="446" r="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1081" y="453" font-size="17" fill="#020617">否</text>

    <rect x="170" y="502" width="750" height="50" rx="7" fill="#3b82f6"/>
    <text x="492" y="535" font-size="21" font-weight="700" fill="#ffffff">🔍 开始检索</text>
    <rect x="940" y="502" width="750" height="50" rx="7" fill="#dedfe4"/>
    <text x="1285" y="535" font-size="21" font-weight="700" fill="#020617">🗑 清空</text>

    <text x="729" y="890" font-size="16" fill="#a8b1c1">通过 API 使用 🚀 · 使用 Gradio 构建 🔶 · 设置 ⚙</text>
  </g>
</svg>
