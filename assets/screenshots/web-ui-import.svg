<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="915" viewBox="0 0 1860 915" role="img" aria-labelledby="title desc">
  <title id="title">miniR 文档入库界面截图</title>
  <desc id="desc">RAG 知识库管理系统的文档入库页面，包含文件夹路径、扫描文件、扫描结果和入库设置。</desc>
  <rect width="1860" height="915" rx="6" fill="#f3f6fb"/>
  <rect x="1" y="1" width="1858" height="913" rx="6" fill="none" stroke="#94a3b8"/>
  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(164 28)">
      <rect x="10" y="4" width="18" height="28" fill="#83d84f" stroke="#4cae2f"/>
      <rect x="18" y="12" width="18" height="28" fill="#60a5fa" stroke="#2563eb"/>
      <rect x="26" y="20" width="18" height="28" fill="#e64980" stroke="#be185d"/>
      <line x1="6" y1="30" x2="47" y2="30" stroke="#475569" stroke-width="2"/>
      <text x="62" y="31" font-size="38" font-weight="700" fill="#020617">RAG 知识库管理系统</text>
    </g>

    <g transform="translate(165 92)" font-size="18">
      <text x="20" y="16" fill="#2563eb">文档入库</text>
      <text x="128" y="16" fill="#020617">文档列表</text>
      <text x="240" y="16" fill="#020617">检索测试</text>
      <text x="350" y="16" fill="#020617">系统管理</text>
      <line x1="0" y1="29" x2="1518" y2="29" stroke="#d7dce5"/>
      <line x1="0" y1="29" x2="108" y2="29" stroke="#3b82f6" stroke-width="3"/>
    </g>

    <text x="165" y="168" font-size="18" fill="#020617">输入服务器上的文件夹路径，系统自动递归扫描支持的文档并入库。</text>
    <text x="168" y="216" font-size="17" fill="#020617">✅ 支持 .md, .docx, .pptx, .xlsx, .pdf ✅ 图片引用完整保留 ✅ 扫描时已入库的文档会自动跳过。</text>

    <rect x="165" y="245" width="1167" height="112" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="181" y="276" font-size="17" fill="#475569">文件夹路径</text>
    <rect x="181" y="292" width="1136" height="51" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="194" y="325" font-size="17" fill="#a8b1c1">如 D:\docs 或 /home/user/docs</text>

    <rect x="1353" y="245" width="332" height="49" rx="7" fill="#dedfe4"/>
    <text x="1465" y="277" font-size="21" font-weight="700" fill="#020617">📁 扫描文件</text>

    <rect x="165" y="377" width="1520" height="112" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="181" y="409" font-size="17" fill="#475569">扫描结果</text>
    <rect x="181" y="425" width="1488" height="51" rx="4" fill="#ffffff" stroke="#d7dce5"/>

    <text x="164" y="530" font-size="15" fill="#475569">扫描到的文件列表</text>
    <rect x="165" y="550" width="1520" height="48" rx="4" fill="#f8fafc" stroke="#d7dce5"/>
    <line x1="748" y1="550" x2="748" y2="598" stroke="#d7dce5"/>
    <line x1="1330" y1="550" x2="1330" y2="598" stroke="#d7dce5"/>
    <text x="177" y="580" font-size="17" font-weight="700" fill="#020617">完整路径</text>
    <text x="758" y="580" font-size="17" font-weight="700" fill="#020617">相对路径</text>
    <text x="1340" y="580" font-size="17" font-weight="700" fill="#020617">状态</text>

    <text x="165" y="647" font-size="25" font-weight="700" fill="#020617">入库设置</text>
    <rect x="165" y="671" width="751" height="133" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="181" y="705" font-size="17" fill="#64748b">分块策略</text>
    <text x="181" y="727" font-size="14" fill="#a8b1c1">title: 按标题分块, length: 按长度分块</text>
    <rect x="181" y="741" width="719" height="49" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="202" y="774" font-size="17" fill="#020617">length</text>
    <text x="860" y="774" font-size="16" fill="#020617">⌄</text>

    <rect x="937" y="671" width="748" height="243" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="953" y="705" font-size="17" fill="#64748b">分块大小（字符数）</text>
    <text x="953" y="728" font-size="14" fill="#a8b1c1">仅 length 策略生效，默认 512</text>
    <rect x="953" y="740" width="716" height="52" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="965" y="773" font-size="17" fill="#020617">512</text>
    <text x="953" y="835" font-size="17" fill="#64748b">重叠比例</text>
    <text x="953" y="860" font-size="14" fill="#a8b1c1">仅 length 策略生效，默认 0.1（10%）</text>
    <rect x="953" y="872" width="716" height="42" rx="4" fill="#ffffff" stroke="#d7dce5"/>
    <text x="965" y="902" font-size="17" fill="#020617">0.1</text>

    <text x="1625" y="530" font-size="20" fill="#64748b">□</text>
    <text x="1660" y="530" font-size="20" fill="#64748b">⌗</text>
  </g>
</svg>
