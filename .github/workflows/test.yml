name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy python-docx python-pptx openpyxl PyMuPDF

      - name: Run tests
        run: python -B -m unittest discover -s tests
